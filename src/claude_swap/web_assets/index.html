<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tool usage</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#1d1d1b;--muted:#73716b;--line:#e2e1dc;--track:#ebeae5;--ok:#2f7a4c;--warn:#a86b12;--danger:#b42318;--accent:#b4532f;--banner:#fff3e0}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--text:#ecebe6;--muted:#9b9a93;--line:#2d2d2a;--track:#2b2b28;--ok:#6cc08b;--warn:#f0b357;--danger:#ff7b72;--accent:#e8906f;--banner:#3a2a12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:640px;margin:auto;padding:8px}h1{font-size:18px;margin:3px 0}.sub{color:var(--muted);font-size:11px;margin:0 0 6px}.banner{display:none;background:var(--banner);padding:6px 8px;border-radius:6px;margin:4px 0;font-size:11px}.banner.show{display:block}section{margin:4px 0 8px}details{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}summary{list-style:none;cursor:pointer;padding:6px 8px;font-weight:650;display:flex;gap:7px;align-items:center}summary::-webkit-details-marker{display:none}.headline{font-size:11px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{padding:4px 7px;border-top:1px solid var(--line)}.line1{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:18px}.line2{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding-top:3px}.credits{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}.rank,.chip,.active,.stale{font-size:10px;line-height:15px;white-space:nowrap;border-radius:4px;padding:0 4px;flex:none}.rank{background:var(--line);font-variant-numeric:tabular-nums}.identity{font-weight:600;flex:0 0 auto;min-width:8ch;max-width:18ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suffix,.meta{color:var(--muted);font-size:10px;white-space:nowrap}.suffix{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}.active{color:#fff;background:var(--ok)}.stale{color:var(--muted);border:1px solid var(--line)}.chip{border:1px solid var(--line);color:var(--muted)}.mini{display:flex;align-items:center;gap:3px;font-size:10px;white-space:nowrap;min-width:0}.bar{height:4px;width:36px;border-radius:5px;background:var(--track);overflow:hidden}.fill{display:block;height:100%;background:var(--ok)}.fill.warn{background:var(--warn)}.fill.danger{background:var(--danger)}.meta{margin-left:auto}.note{font-size:10px;color:var(--muted);margin:2px 0 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}.empty{padding:8px;color:var(--muted);font-size:11px}
</style>
</head>
<body><main>
<h1>Tool usage</h1><p class="sub" id="sub">Loading…</p><div class="banner" id="banner" role="status"></div>
<section id="accounts" aria-live="polite"></section>
</main>
<script>
(function(){"use strict";
var POLL_MS=15000, STALE_S=120, snapshot=null, receivedAt=0, failed=false;
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function dur(s){s=Math.max(0,s);if(s<60)return Math.round(s)+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"}
function reset(ts){var n=Number(ts);if(!isFinite(n))return "";return dur(n-Date.now()/1000)}
function localPart(s){if(!s)return "account";return String(s).split("@")[0]}
function percent(w){if(typeof w.usedPercent==="number")return w.usedPercent;if(typeof w.remaining==="number")return 100-w.remaining;if(w.unit==="credits"&&typeof w.used==="number"&&w.limit)return 100*w.used/w.limit;return null}
function creditChips(usage){var out=[];function add(v,label){if(!v||!(Number(v.available)>0))return;var text=(label==="Fable"?"Fable ":"")+"↺"+v.available,expiry=v.earliestExpiresAt||v.expires_at;if(expiry){var d=typeof expiry==="number"?new Date(expiry*1000):new Date(expiry);if(!isNaN(d.getTime()))text+=" · "+d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}out.push(text)}
if(usage){add(usage.resetCredits||usage.reset_credits,"Resets");add(usage.fableResetCredits||usage.fable_reset_credits,"Fable");var obs=usage.observations||[];obs.forEach(function(o){var d=o&&o.data;if(d&&typeof d==="object")add(d.resetCredits||d.reset_credits,"Resets")})}return out}
function mini(w){var label=w.label||w.key||"Usage",p=percent(w),node=el("span","mini");var compact=label.replace(/five.hour/i,"5h").replace(/seven.day|weekly/i,"7d").replace(/monthly/i,"mo").replace(/bonus/i,"Fable");node.appendChild(el("span","",compact));if(w.unit==="credits"&&w.used!=null&&w.limit!=null)node.appendChild(el("span","",Number(w.used).toLocaleString()+"/"+Number(w.limit).toLocaleString()));else if(p!=null){var bar=el("span","bar"),fill=el("span","fill"+(p>=90?" danger":p>=70?" warn":""));fill.style.width=Math.max(0,Math.min(100,p))+"%";bar.appendChild(fill);node.appendChild(bar);node.appendChild(el("b","",Math.round(p)+"%"))}if(w.resetsAt)node.appendChild(el("span","meta",reset(w.resetsAt)));return node}
function accountCard(acc,tool){var row=el("article","row"),line=el("div","line1"),rank=Number(acc.rank)||1;line.appendChild(el("span","rank","#"+rank));var identity=(acc.identity&&acc.identity.email)||acc.email||acc.alias||"account";line.appendChild(el("span","identity",localPart(identity)));var suffix=acc.plan||acc.usage&&acc.usage.plan||acc.organizationName||acc.identity&&acc.identity.organizationName||acc.kind||"";if(suffix)line.appendChild(el("span","suffix",suffix));if(acc.active)line.appendChild(el("span","active","active"));var usage=acc.usage||acc.lastGoodUsage||{};if(!acc.usage&&acc.lastGoodUsage)usage.state="stale";if(usage.state==="stale")line.appendChild(el("span","stale","stale"));var age=usage.observedAt?Math.max(0,Math.round(Date.now()/1000-usage.observedAt)):(acc.usageAgeSeconds==null?acc.lastGoodAgeSeconds:acc.usageAgeSeconds);var sourceName=usage.source||(tool==="claude"?"Claude":"usage");var source=el("span","meta",age==null?"":age+"s ago");source.title=sourceName;if(age!=null)source.dataset.age=String(age);line.appendChild(source);row.appendChild(line);
var line2=el("div","line2"),wins=usage.windows||[];wins.forEach(function(w){line2.appendChild(mini(w))});if(tool==="claude"){var u=usage;if(u.fiveHour)line2.appendChild(mini({key:"5h",label:"5h",usedPercent:u.fiveHour.pct,resetsAt:u.fiveHour.resetsAt}));if(u.sevenDay)line2.appendChild(mini({key:"7d",label:"7d",usedPercent:u.sevenDay.pct,resetsAt:u.sevenDay.resetsAt}));if(u.scoped)u.scoped.forEach(function(w){line2.appendChild(mini({label:w.name,usedPercent:w.pct,resetsAt:w.resetsAt}))})}var credits=creditChips(usage);if(credits.length){var creditRow=el("div","credits");credits.forEach(function(t){creditRow.appendChild(el("span","chip",t))});line2.appendChild(creditRow)}row.appendChild(line2);
var err=usage.error||acc.note;if(err)row.appendChild(el("div","note",err));return row}
function section(tool){var accounts=(tool.accounts||[]).filter(function(a){return a.registered!==false});if(!accounts.length)return null;var details=el("details",""),summary=el("summary",""),label=tool.label||tool.tool;summary.appendChild(el("span","",label));summary.appendChild(el("span","headline",tool.headline||""));details.open=true;details.appendChild(summary);accounts.forEach(function(a){details.appendChild(accountCard(a,tool.tool))});return details}
function render(){var list=$("accounts");list.textContent="";if(!snapshot){list.appendChild(el("p","empty",failed?"Can't reach the dashboard server.":"Waiting for the first reading…"));tick();return}var claude=snapshot.claude;if(claude){var active=(claude.accounts||[]).filter(function(a){return a.active})[0],u=active&&(active.usage||active.lastGoodUsage)||{},parts=[];if(u.fiveHour)parts.push("5h "+Math.round(u.fiveHour.pct)+"%");if(u.sevenDay)parts.push("7d "+Math.round(u.sevenDay.pct)+"%");var sec=section({tool:"claude",label:"Claude Code",headline:parts.join(" · "),accounts:claude.accounts||[]});if(sec)list.appendChild(sec)}(snapshot.tools||[]).forEach(function(t){var sec=section(t);if(sec)list.appendChild(sec)});if(!list.childNodes.length)list.appendChild(el("p","empty","No registered accounts."));tick()}
function tick(){var age=receivedAt?(Date.now()-receivedAt)/1000:0,generated=snapshot&&snapshot.generatedAt?Date.parse(snapshot.generatedAt):null,msg="";if(generated!=null){var s=(Date.now()-generated)/1000;$("sub").textContent="Updated "+dur(s)+" ago · refreshes every 15 s";if(failed)msg="Can't reach the dashboard server. Showing the last reading from "+dur(s)+" ago.";else if(s>STALE_S)msg="Stale: last dashboard reading is "+dur(s)+" old."}else{$("sub").textContent=failed?"Offline":"Loading…";if(failed)msg="Can't reach the dashboard server."}var b=$("banner");b.textContent=msg;b.classList.toggle("show",!!msg);document.querySelectorAll(".meta").forEach(function(n){if(n.dataset.age){n.textContent=dur(Number(n.dataset.age)+age)+" ago"}})}
function load(){return fetch("/api/usage",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(b){snapshot=b;receivedAt=Date.now();failed=false}).catch(function(){failed=true}).then(render)}
load();setInterval(load,POLL_MS);setInterval(tick,1000);document.addEventListener("visibilitychange",function(){if(!document.hidden)load()})})();
</script></body></html>
