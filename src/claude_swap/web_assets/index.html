<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tool usage</title>
<style>
:root {
  --color-ground: #0b0b0d;
  --color-surface: #141417;
  --color-hairline: #26262b;
  --color-track: #2a2a30;
  --color-ink: #f3f2ee;
  --color-ink-2: #c4c2bb;
  --color-ink-3: #94928b;
  --color-accent: #e3c27e;
  --color-on-accent: #1a1408;
  --color-ok: #5fd3a0;
  --color-warn: #f2b45a;
  --color-danger: #ff8a7e;
  --font-family: -apple-system, BlinkMacSystemFont, SF Pro Text, Inter, Segoe UI, system-ui, sans-serif;
  --font-title: 18px;
  --font-name: 14px;
  --font-numeral: 16px;
  --font-caption: 11.5px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-meter: 64px;
  --radius-card: 14px;
  --radius-chip: 5px;
  --radius-bar: 3px;
  /* status dot breathes while the reading is live; off under reduced motion */
  --motion-breathe: 2400ms;
}
*{box-sizing:border-box}
html{background:var(--color-ground)}
body{margin:0;min-height:100vh;background:var(--color-ground);color:var(--color-ink);font:400 var(--font-caption)/1.35 var(--font-family);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:auto;padding:max(var(--space-3),env(safe-area-inset-top)) var(--space-4) max(var(--space-4),env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) 0 var(--space-1)}
h1{margin:0;font-size:var(--font-title);font-weight:650;letter-spacing:-.01em;color:var(--color-ink)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--color-ink-2);font-size:var(--font-caption)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--color-ok)}
.status.live .dot{animation:breathe var(--motion-breathe) ease-in-out infinite}
.status.stale .dot{background:var(--color-warn)}
.status.off .dot{background:var(--color-danger)}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.live .dot{animation:none}}
.legend{margin:var(--space-1) 0 0;color:var(--color-ink-3);font-size:var(--font-caption)}
.banner{display:none;margin:0 0 var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-chip);border:1px solid var(--color-warn);color:var(--color-warn)}
.banner.show{display:block}
section{margin:0 0 var(--space-2);background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:var(--radius-card);overflow:hidden}
h2{margin:0;padding:var(--space-2) var(--space-3) 2px;font-size:var(--font-caption);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n,2),var(--space-meter));column-gap:var(--space-3);row-gap:var(--space-1);align-items:start;padding:7px var(--space-3);border-top:1px solid var(--color-hairline)}
h2+.row{border-top:0}
.row.n1{grid-template-columns:minmax(0,1fr) calc(var(--space-meter) * 2)}
.row.live{box-shadow:inset 2px 0 0 var(--color-accent)}
.name{font-size:var(--font-name);font-weight:600;line-height:1.25;overflow-wrap:anywhere;padding-top:1px}
.who{min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--space-2);margin-top:3px;color:var(--color-ink-3)}
.b .meta{grid-column:1/-1;margin-top:0}
.tag{font-size:var(--font-caption);font-weight:700;letter-spacing:.06em;padding:1px 5px;border-radius:var(--radius-chip);line-height:1.4}
.tag.live{background:var(--color-accent);color:var(--color-on-accent)}
.tag.best{border:1px solid var(--color-ink-3);color:var(--color-ink)}
.tag.stale{border:1px solid var(--color-ink-3);color:var(--color-ink-2)}
.row.stale .mv,.row.stale .mr{color:var(--color-ink-3)}
.row.stale .name{color:var(--color-ink-2)}
.note{margin:0;padding:var(--space-2) var(--space-3);border-top:1px solid var(--color-hairline);color:var(--color-ink-3)}
.m{min-width:0}
.mt{display:flex;align-items:baseline;justify-content:space-between;gap:2px}
.mk{color:var(--color-ink-3)}
.mv{font-size:var(--font-numeral);font-weight:600}
.bar{display:block;height:4px;margin:3px 0;border-radius:var(--radius-bar);background:var(--color-track);overflow:hidden}
.fill{display:block;height:100%;background:var(--color-ok)}
.fill.warn{background:var(--color-warn)}
.fill.danger{background:var(--color-danger)}
.mr{display:block;color:var(--color-ink-2);white-space:nowrap}
.mr.quiet{color:var(--color-ink-3)}
.empty{padding:var(--space-4);color:var(--color-ink-3);text-align:center}
@media (max-width:370px){.row{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}.who{grid-column:1/-1}}
/* concept B: headroom first */
.b .row{grid-template-columns:minmax(0,1fr) auto}
.b .big{text-align:right}
.b .big .mv{font-size:24px;font-weight:600;letter-spacing:-.01em}
.b .big .bar{width:96px;margin-left:auto}
.b .rest{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);color:var(--color-ink-2)}
</style>
</head>
<body data-concept="a" data-design-round="r3" class="a"><main>
<header><h1>Usage</h1><span class="status" id="status" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><span id="sub">Loading…</span></span></header>
<div class="banner" id="banner" role="status"></div>
<div id="accounts" aria-live="polite"></div>
<p class="legend">% used · time until reset · ↺ reset credits</p>
</main>
<script>
(function(){"use strict";
var POLL_MS=15000, STALE_S=120, ROW_STALE_S=900, snapshot=null, failed=false, CONCEPT=document.body.dataset.concept||"a";
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function epoch(ts){if(ts==null||ts==="")return null;if(typeof ts==="number")return isFinite(ts)?ts:null;var n=Number(ts);if(isFinite(n))return n;var d=Date.parse(ts);return isNaN(d)?null:d/1000}
function dur(s){s=Math.max(0,s);if(s<60)return Math.round(s)+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"}
function until(s){s=Math.max(0,Math.round(s));var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);if(d)return d+"d "+h+"h";if(h)return h+"h "+m+"m";if(m)return m+"m";return s+"s"}
function localPart(s){if(!s)return "account";return String(s).split("@")[0]}
function percent(w){if(typeof w.usedPercent==="number")return w.usedPercent;if(typeof w.remaining==="number")return 100-w.remaining;if(w.unit==="credits"&&typeof w.used==="number"&&w.limit)return 100*w.used/w.limit;return null}
function credits(usage){var parts=[],seen={};function add(v,label){if(!v||!(Number(v.available)>0))return;var key=label+v.available;if(seen[key])return;seen[key]=1;parts.push(label+v.available)}
if(usage){add(usage.resetCredits||usage.reset_credits,"");add(usage.fableResetCredits||usage.fable_reset_credits,"Fable ");(usage.observations||[]).forEach(function(o){var d=o&&o.data;if(d&&typeof d==="object")add(d.resetCredits||d.reset_credits,"")})}return parts.length?["↺ "+parts.join(" · ")]:[]}
function shortLabel(w){return String(w.label||w.key||"use").replace(/^(five|5).hour( window)?$/i,"5h").replace(/^(seven.day|weekly)( window)?$/i,"7d").replace(/^(monthly|plan)( credits)?$/i,"credits")}
function windows(usage,tool){var out=(usage.windows||[]).slice();if(tool==="claude"){if(usage.fiveHour)out.push({label:"5h",usedPercent:usage.fiveHour.pct,resetsAt:usage.fiveHour.resetsAt});if(usage.sevenDay)out.push({label:"7d",usedPercent:usage.sevenDay.pct,resetsAt:usage.sevenDay.resetsAt});(usage.scoped||[]).forEach(function(w){out.push({label:w.name,usedPercent:w.pct,resetsAt:w.resetsAt})})}return out}
function ageOf(acc,usage){if(typeof acc.usageAgeSeconds==="number")return acc.usageAgeSeconds;var o=epoch(usage.observedAt);return o==null?null:Date.now()/1000-o}
function resetSlot(w,p){var r=el("span","mr"),at=epoch(w.resetsAt!=null?w.resetsAt:w.resetsOn);if(at!=null)r.dataset.at=String(at);else{r.textContent=p===0?"not started":"no reset time";r.className="mr quiet"}return r}
function fillClass(p){return "fill"+(p>=90?" danger":p>=70?" warn":"")}
function meter(w){var p=percent(w),node=el("div","m"),u=(w.unit==="credits"&&w.used!=null&&w.limit!=null)?Number(w.used).toLocaleString()+" / "+Number(w.limit).toLocaleString()+" used":"";var top=el("div","mt");if(u)node.title=u;top.appendChild(el("span","mk",shortLabel(w)));top.appendChild(el("span","mv",p!=null?Math.round(p)+"%":"–"));node.appendChild(top);var bar=el("span","bar"),fill=el("span",fillClass(p));fill.style.width=(p==null?0:Math.max(0,Math.min(100,p)))+"%";bar.appendChild(fill);node.appendChild(bar);node.appendChild(resetSlot(w,p));return node}
function bigMeter(w){var p=percent(w),node=el("div","m big");node.appendChild(el("div","mv",p!=null?Math.round(p)+"%":"–"));var bar=el("span","bar"),fill=el("span",fillClass(p));fill.style.width=(p==null?0:Math.max(0,Math.min(100,p)))+"%";bar.appendChild(fill);node.appendChild(bar);var cap=el("span","mr");cap.appendChild(document.createTextNode(shortLabel(w)+" · "));node.appendChild(cap);var r=resetSlot(w,p);r.style.display="inline";cap.appendChild(r);return node}
function accountRow(acc,tool,cols,many){var usage=acc.usage||acc.lastGoodUsage||{},age=ageOf(acc,usage),stale=usage.state==="stale"||(!acc.usage&&!!acc.lastGoodUsage)||(age!=null&&age>ROW_STALE_S),row=el("article","row"+(acc.active?" live":"")+(stale?" stale":""));row.style.setProperty("--n",cols);var identity=(acc.identity&&acc.identity.email)||acc.email||acc.alias||"account";var who=el("div","who");who.appendChild(el("div","name",localPart(identity)));row.appendChild(who);
var ws=windows(usage,tool);if(CONCEPT==="b"){var sorted=ws.slice().sort(function(a,b){return (percent(b)||0)-(percent(a)||0)});if(sorted[0])row.appendChild(bigMeter(sorted[0]));else row.appendChild(el("div",""))}else{ws.slice(0,cols).forEach(function(w){row.appendChild(meter(w))});for(var i=Math.min(ws.length,cols);i<cols;i++)row.appendChild(el("div","m"))}
var meta=el("div","meta");if(acc.active)meta.appendChild(el("span","tag live","LIVE"));if(many&&Number(acc.rank)===1&&!stale&&!acc.active)meta.appendChild(el("span","tag best","MOST ROOM"));if(stale)meta.appendChild(el("span","tag stale","STALE"+(age!=null?" · "+dur(age)+" old":"")));var plan=acc.plan||usage.plan||acc.organizationName||(acc.identity&&(acc.identity.organizationName||acc.identity.organization))||acc.kind||"";if(plan)meta.appendChild(el("span","",plan));credits(usage).forEach(function(t){meta.appendChild(el("span","",t))});if(CONCEPT==="b")row.appendChild(meta);else who.appendChild(meta);
if(CONCEPT==="b"&&sorted&&sorted.length>1){var rest=el("div","rest");sorted.slice(1).forEach(function(w){var p=percent(w),s=el("span","");s.appendChild(document.createTextNode(shortLabel(w)+" "+(p!=null?Math.round(p)+"%":"–")+" · "));var r=resetSlot(w,p);r.style.display="inline";s.appendChild(r);rest.appendChild(s)});row.insertBefore(rest,meta)}
row.dataset.note=usage.error||acc.note||"";return row}
function section(tool){var accounts=(tool.accounts||[]).filter(function(a){return a.registered!==false});if(!accounts.length)return null;var sec=el("section","");sec.appendChild(el("h2","",tool.label||tool.tool));var cols=1;accounts.forEach(function(a){cols=Math.max(cols,Math.min(3,windows(a.usage||a.lastGoodUsage||{},tool.tool).length))});var notes=[];accounts.forEach(function(a){var r=accountRow(a,tool.tool,cols,accounts.length>1);if(cols===1)r.classList.add("n1");sec.appendChild(r);var n=r.dataset.note;if(n&&notes.indexOf(n)<0)notes.push(n)});notes.forEach(function(n){sec.appendChild(el("p","note",n))});return sec}
function render(){var list=$("accounts");list.textContent="";if(!snapshot){list.appendChild(el("p","empty",failed?"Can't reach the dashboard server. It retries every 15 s.":"Waiting for the first reading…"));tick();return}var claude=snapshot.claude;if(claude){var sec=section({tool:"claude",label:"Claude Code",accounts:claude.accounts||[]});if(sec)list.appendChild(sec)}(snapshot.tools||[]).forEach(function(t){var s=section(t);if(s)list.appendChild(s)});if(!list.childNodes.length)list.appendChild(el("p","empty","No registered accounts."));tick()}
function tick(){var now=Date.now()/1000,generated=snapshot&&snapshot.generatedAt?Date.parse(snapshot.generatedAt):null,msg="",state="live",label="Loading…";if(generated!=null){var s=(Date.now()-generated)/1000;label=dur(s)+" ago";if(failed){state="off";label="offline · "+label;msg="Can't reach the dashboard server. Showing the reading from "+dur(s)+" ago; it retries every 15 s."}else if(s>STALE_S){state="stale";label="stale · "+label;msg="The last reading is "+dur(s)+" old."}}else if(failed){state="off";label="offline";msg="Can't reach the dashboard server. It retries every 15 s."}var st=$("status");st.className="status "+state;$("sub").textContent=label;var b=$("banner");b.textContent=msg;b.classList.toggle("show",!!msg);document.querySelectorAll(".mr[data-at]").forEach(function(n){var left=Number(n.dataset.at)-now;n.textContent=left>0?until(left):"reset due";n.title=new Date(Number(n.dataset.at)*1000).toLocaleString()})}
function load(){return fetch("/api/usage",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(b){snapshot=b;failed=false}).catch(function(){failed=true}).then(render)}
load();setInterval(load,POLL_MS);setInterval(tick,1000);document.addEventListener("visibilitychange",function(){if(!document.hidden)load()})})();
</script></body></html>
